<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ウイングベイウォーキング受付</title>
<link rel="stylesheet" href="assets/style.css">
<!-- 外部サイトから読み込むスクリプトは、配布物のハッシュ（integrity）と一致したときだけ実行させる。
     一致しなければブラウザが読み込みを止めるため、配信元が改ざんされても
     このページで実行されることはない。値はcdnjsの公表値と実ファイルで一致を確認済み。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
        integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
        crossorigin="anonymous"></script>
<script src="assets/config.js"></script>
</head>
<body class="kiosk">
<div class="kiosk-wrap">
  <div class="kiosk-left">
    <h1>ウイングベイウォーキング</h1>
    <p class="kiosk-sub">スマートフォンの「カメラ」アプリで<br>このQRコードを読み取ってください</p>
    <p id="todayCount" class="today-count" style="display:none"></p>
    <p id="offline" class="offline" style="display:none"></p>
  </div>
  <div class="kiosk-right">
    <div id="qrcode" class="qrbox"></div>
    <p id="countdown" class="countdown"></p>
  </div>
</div>

<!-- 飾りのベイベーたち。
     CSSで本文より後ろ（z-index:1）に置いてあるため、画面が狭くて重なった場合でも
     QRコードの白いカードの裏に隠れるだけで、読み取りを妨げることはない。 -->
<div class="baybe-layer">
  <img class="baybe b-run"   src="assets/baybe-run.png"   alt="">
  <img class="baybe b-jump"  src="assets/baybe-jump.png"  alt="">
  <img class="baybe b-kick"  src="assets/baybe-kick.png"  alt="">
  <img class="baybe b-pouch" src="assets/baybe-pouch.png" alt="">
  <img class="baybe b-wave"  src="assets/baybe-wave.png"  alt="">
  <img class="baybe b-hello" src="assets/baybe-hello.png" alt="">
  <img class="baybe b-scale" src="assets/baybe-scale.png" alt="">
  <img class="baybe b-shout" src="assets/baybe-shout.png" alt="">
</div>
<div class="bubble">いっしょに歩こう！</div>
<button id="fullscreenBtn" style="display:none;position:fixed;top:16px;right:16px;z-index:100;padding:14px 20px;font-size:16px;font-weight:bold;background:#f2a541;color:#fff;border:none;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.3);">
  画面いっぱいに表示する（最初に1回タップしてください）
</button>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var adminKey = params.get('key') || '';
  var qrEl = document.getElementById('qrcode');
  var countdownEl = document.getElementById('countdown');
  var offlineEl = document.getElementById('offline');
  var countdownTimer = null;
  var retryTimer = null;
  var swapTimer = null;
  var pending = null;   // 次の時間帯のQR（サーバーから先にもらっておく）

  // ---- 全画面表示（アドレスバー・タブを隠す。対応端末のみ） ----
  // ブラウザの仕様上、タップなどの操作がないと全画面化できないため、
  // ボタンを表示してスタッフにタップしてもらう。一度全画面にすれば、
  // 以後は（iPadのガイドアクセス・Androidの画面固定と組み合わせて）
  // アドレスバーやタブ切り替えに触れられなくなる。
  var fsBtn = document.getElementById('fullscreenBtn');
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFsButton() {
    if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
      fsBtn.style.display = 'none'; // この端末は全画面表示に対応していない
      return;
    }
    fsBtn.style.display = isFullscreen() ? 'none' : 'block';
  }
  fsBtn.addEventListener('click', function () {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el).catch(function () {});
  });
  document.addEventListener('fullscreenchange', updateFsButton);
  document.addEventListener('webkitfullscreenchange', updateFsButton);
  updateFsButton();

  // ---- 画面スリープ防止（対応端末のみ） ----
  var wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) { /* 対応していない端末もあるため無視してよい */ }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') requestWakeLock();
  });
  requestWakeLock();

  // 更新間隔が長い（例：5分）ときに「287秒後」のような読みにくい表示にならないよう、
  // 1分以上は「○分○秒」の形にする。
  function formatRemain(seconds) {
    if (seconds < 60) return seconds + '秒後に更新';
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return s === 0 ? (m + '分後に更新') : (m + '分' + s + '秒後に更新');
  }

  // カウントダウンは「残り秒数を1ずつ減らす」のではなく、
  // 切り替わる時刻（endAt）を決めておき、現在時刻との差を毎回計算して表示する。
  // 1秒ごとに引き算する方式だと、通信や画面の描画で処理が遅れたぶんだけ
  // 表示が実際の時刻からずれていくため。
  //
  // 残り0秒になった瞬間は、サーバーに問い合わせず、先にもらってある
  // 次のQR（pending）へその場で差し替える。これで表示が固まらない。
  function startCountdown(seconds, windowSeconds) {
    clearInterval(countdownTimer);
    var endAt = Date.now() + Math.max(1, seconds) * 1000;
    var span = windowSeconds || seconds || 300;

    function tick() {
      var remain = Math.ceil((endAt - Date.now()) / 1000);
      if (remain <= 0) {
        if (pending) {
          renderQr(pending);          // 通信を待たずに即切り替え
          pending = null;
          endAt = Date.now() + span * 1000;
          remain = span;
          fetchToken();               // 裏で次のQRを取りに行く（表示には影響しない）
        } else {
          remain = 0;                 // 予備のQRが無いときは応答を待つ
          fetchToken();
        }
      }
      countdownEl.textContent = formatRemain(remain);
    }

    tick();
    countdownTimer = setInterval(tick, 200);
  }

  // 通信に失敗したときの共通処理。画面に理由を出しつつ、5秒後に自動で再試行する。
  // 一度つながれば offlineEl は消えるので、スタッフが操作しなくても自然に復帰する。
  function showTrouble(message) {
    offlineEl.style.display = 'block';
    offlineEl.textContent = message;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(fetchToken, 5000);
  }

  // 達成人数の表示を書き換える。QRの更新（5分ごと）とは別に動かすため関数に切り出す。
  function renderCount(n) {
    var el = document.getElementById('todayCount');
    if (typeof n !== 'number') return;        // 取得できなかったときは前の数字を残す
    el.textContent = '本日のウォーキング達成：' + n + '人';
    el.style.display = 'block';
  }

  function renderQr(token) {
    var base = window.WB_CONFIG.SITE_BASE_URL;
    var url = base + 'start.html?t=' + encodeURIComponent(token);
    qrEl.innerHTML = '';
    new QRCode(qrEl, { text: url, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M });
  }

  async function fetchToken() {
    try {
      var base = window.WB_CONFIG.APPS_SCRIPT_URL;
      var res = await fetch(base + '?action=kioskToken&key=' + encodeURIComponent(adminKey), { cache: 'no-store' });
      // Apps Scriptのデプロイを消してしまった場合などは、JSONではなくエラーのHTMLが
      // 返ってくる。そのままJSONとして読もうとすると通信エラーと区別がつかなくなるため、
      // いったん文字列で受け取ってから中身を確かめる。
      var text = await res.text();
      var json;
      try {
        json = JSON.parse(text);
      } catch (parseError) {
        showTrouble('接続先の応答が正しくありません（HTTP ' + res.status + '）。' +
          'Apps Scriptのデプロイ設定を確認してください。');
        return;
      }

      if (!json.ok) {
        offlineEl.style.display = 'block';
        offlineEl.textContent = '設定エラー：' + (json.reason || '');
        return;
      }
      offlineEl.style.display = 'none';

      if (json.operationEnabled === false) {
        pending = null;
        clearInterval(countdownTimer);
        qrEl.innerHTML = '';
        countdownEl.textContent = '';
        offlineEl.style.display = 'block';
        offlineEl.textContent = '本日は受付を休止しています';
        clearTimeout(retryTimer);
        retryTimer = setTimeout(fetchToken, 30000);
        return;
      }

      renderQr(json.token);
      pending = json.nextToken || null;
      startCountdown(json.remainSeconds || json.windowSeconds || 300,
                     json.windowSeconds || 300);

      renderCount(json.todayCompletions);
    } catch (e) {
      showTrouble('再接続中…（インターネット接続を確認してください）');
    }
  }

  if (!adminKey) {
    offlineEl.style.display = 'block';
    offlineEl.textContent = 'URLに管理キー（?key=...）が指定されていません。README.mdを確認してください。';
  } else {
    fetchToken();
  }
})();
</script>
</body>
</html>
