<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ウイングベイウォーキング - 開始</title>
<!-- 問い合わせ先への接続準備を、ページを読み込むのと同時に始めておく。
     携帯回線では、この接続準備だけで0.2〜0.4秒かかるため、先に済ませておくと
     そのぶんお客様の待ち時間が減る。 -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="assets/config.js"></script>
<script src="assets/device.js"></script>
<script>
// 見た目（CSS）や文言（dict.js）の読み込みを待たずに、サーバーへの問い合わせを先に始める。
// 待ち時間のほとんどはサーバーの応答待ちなので、これを一番早く走らせるのが最も効く。
// ここで失敗しても、下の run() が従来どおり callApi で問い合わせ直すため動作は変わらない。
window.__wbEarly = (function () {
  try {
    var token = new URLSearchParams(window.location.search).get('t') || '';
    if (!token) return null;
    return fetch(window.WB_CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'start', deviceId: getOrCreateDeviceId(), token: token })
    }).then(function (r) { return r.json(); });
  } catch (e) {
    return null;
  }
})();
</script>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/dict.js"></script>
<script src="assets/api.js"></script>
</head>
<body>
<div class="wrap">
  <h1 class="logo">ウイングベイウォーキング</h1>
  <div class="card">
    <p class="message" id="message"></p>
    <div class="spinner" id="spinner"></div>
    <a id="pointButton" class="button" style="display:none" target="_top"></a>
  </div>
  <p class="tip" id="cameraTip"></p>
  <div class="langbar">
    <label id="langLabel"></label>
    <select id="langSelect">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>
</div>
<script>
(function () {
  function applyLang() {
    document.getElementById('cameraTip').textContent = t('camera_tip');
    document.getElementById('langLabel').textContent = t('lang_label');
    var btn = document.getElementById('pointButton');
    if (btn.style.display !== 'none') btn.textContent = t('finish_button');
  }

  var langSelect = document.getElementById('langSelect');
  try { langSelect.value = localStorage.getItem('wb_lang') || 'ja'; } catch (e) {}
  // 廃止した言語（タイ語・中国語）が端末に保存されたままの場合は選択欄が空になるため、
  // 選択肢に無い値だったときは日本語に戻す。
  if (!langSelect.value) langSelect.value = 'ja';
  applyLang();

  var lastJson = null;
  function redraw() {
    if (lastJson) setMessage(renderStartMessage(lastJson), !lastJson.ok);
  }

  langSelect.addEventListener('change', function () {
    try { localStorage.setItem('wb_lang', langSelect.value); } catch (e) {}
    applyLang();
    redraw();
  });

  function setMessage(text, isError) {
    document.getElementById('spinner').style.display = 'none';
    var el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message' + (isError ? ' error' : ' success');
  }

  document.getElementById('message').textContent = t('start_checking');

  var params = new URLSearchParams(window.location.search);
  var token = params.get('t') || '';

  /**
   * 「ポイントを受け取る」ボタンを出す。
   *
   * 押された時点でサーバーに申請し、返ってきたURLへ移動する。
   * サーバーは1日1回しかURLを返さないので、ボタンを何度押しても
   * ポイントが二重に付くことはない。
   *
   * directUrl が渡されたときは、以前の版のサーバー向けの動き（そのままリンク）。
   */
  function showPointButton(directUrl, deviceId) {
    var btn = document.getElementById('pointButton');
    btn.textContent = t('finish_button');
    btn.style.display = 'inline-block';
    if (directUrl) {
      btn.href = directUrl;
      return;
    }
    btn.href = '#';
    var tapped = false;
    btn.addEventListener('click', async function (ev) {
      ev.preventDefault();
      if (tapped) return; // 連打しても申請は1回だけ
      tapped = true;
      btn.textContent = t('point_taking');
      try {
        var res = await callApi('redeem', { deviceId: deviceId });
        if (res.ok && res.pointUrl) {
          try {
            window.top.location.href = res.pointUrl;
          } catch (e) {
            window.location.href = res.pointUrl;
          }
          return;
        }
        btn.style.display = 'none';
        setMessage(res.reason === 'point_already_taken'
          ? t('point_already_taken')
          : t('point_error'), true);
      } catch (e) {
        // 通信に失敗した場合は、まだ受け取れていないのでもう一度押せるようにする
        tapped = false;
        btn.textContent = t('finish_button');
        setMessage(t('point_error'), true);
      }
    });
  }

  async function run() {
    if (!token) {
      lastJson = { ok: false, reason: 'token_expired' };
      setMessage(renderStartMessage(lastJson), true);
      return;
    }
    var deviceId = getOrCreateDeviceId();
    try {
      var json = window.__wbEarly
        ? await window.__wbEarly
        : await callApi('start', { deviceId: deviceId, token: token });
      lastJson = json;
      setMessage(renderStartMessage(json), !json.ok);
      // 新しいサーバーは、達成しただけではURLを渡さない（canRedeem だけ返す）。
      // json.pointUrl を見ているのは、サーバーを以前の版に戻した場合でも
      // ポイントが受け取れるようにしておくため。
      if (json.ok && json.phase === 'finish' && (json.canRedeem || json.pointUrl)) {
        showPointButton(json.pointUrl || null, deviceId);
      }
    } catch (e) {
      lastJson = { ok: false, reason: 'network_error' };
      setMessage(t('start_error'), true);
    }
  }
  run();
})();
</script>
</body>
</html>
