<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>折り返し地点QRコード印刷用</title>
<!-- 外部サイトから読み込むスクリプトは、配布物のハッシュ（integrity）と一致したときだけ実行させる。
     一致しなければブラウザが読み込みを止めるため、配信元が改ざんされても
     このページで実行されることはない。値はcdnjsの公表値と実ファイルで一致を確認済み。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
        integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
        crossorigin="anonymous"></script>
<script src="assets/config.js"></script>
<style>
  @page { size: A4 portrait; margin: 0; }

  :root {
    --navy: #0b4f7a;
    --blue: #2a8ecb;
    --sky:  #4fb3e8;
    --pale: #e8f4fd;
    --orange: #ef8b1f;
    --ink: #10384f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* BIZ UDPGothic は読みやすさを目的に作られた書体。高齢の方にも読みやすい。 */
    font-family: "BIZ UDPGothic", "Meiryo", "Yu Gothic", sans-serif;
    color: var(--ink);
    background: #f0f0f0;
  }

  .toolbar { text-align: center; padding: 16px; }
  .toolbar button {
    font-size: 18px;
    font-weight: bold;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    background: var(--blue);
    color: #fff;
    cursor: pointer;
  }
  .warn { color: #b3261e; text-align: center; font-size: 16px; padding: 0 16px 8px; }

  .page {
    width: 210mm;
    height: 297mm;
    margin: 0 auto 8mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    overflow: hidden;
    page-break-after: always;
  }
  .page:last-child { page-break-after: auto; }

  /* ===== 見出し ===== */
  .band {
    position: relative;
    width: 100%;
    background: var(--blue);
    color: #fff;
    padding: 8mm 10mm 7mm;
  }
  .band .course {
    display: inline-block;
    font-size: 20pt;
    font-weight: bold;
    letter-spacing: .08em;
    background: rgba(255, 255, 255, .25);
    border-radius: 999px;
    padding: 2mm 9mm;
    margin-bottom: 3mm;
  }
  .band h2 {
    font-size: 40pt;
    line-height: 1.1;
    text-shadow: 0 0.6mm 0 rgba(0, 0, 0, .12);
  }
  .band .baybe {
    position: absolute;
    right: 10mm;
    bottom: 3mm;
    height: 34mm;
  }

  /* ===== 読み取りの案内 ===== */
  .lead {
    font-size: 20pt;
    font-weight: bold;
    color: var(--navy);
    line-height: 1.5;
    margin: 7mm 0 5mm;
  }
  .qrcard {
    background: #fff;
    border: 2mm solid var(--sky);
    border-radius: 6mm;
    padding: 6mm;
    display: inline-block;
    line-height: 0;
  }
  .qrbox { display: inline-block; line-height: 0; }

  /* ===== 次にすること ===== */
  /* 「読んで終わり」と誤解されないよう、次にすることを強く出す */
  .next {
    width: 190mm;
    margin: 7mm 0 0;
    background: var(--navy);
    color: #fff;
    border-radius: 6mm;
    padding: 6mm 8mm;
  }
  .next .tag {
    display: inline-block;
    background: var(--orange);
    color: #fff;
    font-size: 15pt;
    font-weight: bold;
    border-radius: 999px;
    padding: 1.5mm 7mm;
    margin-bottom: 3mm;
  }
  .next p {
    font-size: 23pt;
    font-weight: bold;
    line-height: 1.45;
  }
  .next small {
    display: block;
    font-size: 14pt;
    font-weight: normal;
    margin-top: 2.5mm;
    color: #cfe6f7;
  }

  .note {
    margin-top: 5mm;
    font-size: 14pt;
    font-weight: bold;
    color: var(--navy);
  }
  .note span { color: var(--orange); }

  @media print {
    body { background: #fff; }
    .toolbar, .warn { display: none; }
    .page { margin: 0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">印刷する（A4・3ページ）</button>
</div>
<p class="warn" id="warn" style="display:none">
  ※ assets/config.js の SITE_BASE_URL が未設定です。設定してからこのページを開き直してください。
</p>
<div id="pages"></div>
<script>
  var courses = [
    { code: 'A', label: 'Aコース', baybe: 'run' },
    { code: 'B', label: 'Bコース', baybe: 'kick' },
    { code: 'C', label: 'Cコース', baybe: 'jump' }
  ];

  var base = window.WB_CONFIG.SITE_BASE_URL;
  if (!base || base.indexOf('http') !== 0) {
    document.getElementById('warn').style.display = 'block';
  }

  var pagesEl = document.getElementById('pages');
  courses.forEach(function (c) {
    var page = document.createElement('div');
    page.className = 'page';

    var band = document.createElement('div');
    band.className = 'band';
    band.innerHTML =
      '<span class="course">' + c.label + '</span>' +
      '<h2>折り返し地点</h2>' +
      '<img class="baybe" src="assets/baybe-' + c.baybe + '.png" alt="">';

    var lead = document.createElement('p');
    lead.className = 'lead';
    lead.innerHTML = 'スマートフォンの「カメラ」で<br>このQRコードを読み取ってください';

    var card = document.createElement('div');
    card.className = 'qrcard';
    var qrDiv = document.createElement('div');
    qrDiv.className = 'qrbox';
    card.appendChild(qrDiv);

    // ここで終わりではないことを、はっきり伝える
    var next = document.createElement('div');
    next.className = 'next';
    next.innerHTML =
      '<span class="tag">つぎに</span>' +
      '<p>インフォメーションに戻って、<br>最初に読んだQRを もう一度読む</p>' +
      '<small>読み取るとポイントがもらえます</small>';

    var note = document.createElement('p');
    note.className = 'note';
    note.innerHTML = '最初と最後は、<span>同じカメラ</span>で読んでください';

    page.appendChild(band);
    page.appendChild(lead);
    page.appendChild(card);
    page.appendChild(next);
    page.appendChild(note);
    pagesEl.appendChild(page);

    // ▼ QRコードの中身は従来どおり。1文字も変えないこと。
    var url = (base || 'https://example.com/') + 'goal.html?c=' + c.code;
    new QRCode(qrDiv, { text: url, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });
  });
</script>
</body>
</html>
